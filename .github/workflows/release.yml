name: Publish theme release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.2'
          extensions: dom, mbstring, zlib
          coverage: none
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm release:check
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - name: Ensure committed build and demo assets match
        run: git diff --exit-code -- dist assets
      - run: pnpm package
      - name: Generate release notes and update requirements
        run: python scripts/release.py --notes > build/RELEASE_NOTES.md
      - name: Create and publish version package
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/publish-release.py
